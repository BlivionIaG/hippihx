[project]
name = "hippihx"
version = "0.0.0"
description = "HIP/FlyDSL kernel zoo for RDNA (gfx1030 dest)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Blivion" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
flydsl = ["flydsl"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hippihx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
